spring.application.name=weathering

# Supply credentials through the process environment, never source control.
openweather.api.key=${OPENWEATHER_API_KEY}

openweather.api.base-url=https://api.openweathermap.org/data/2.5/weather

openweather.api.geo-url=https://api.openweathermap.org/geo/1.0/direct

openweather.api.onecall-url=https://api.openweathermap.org/data/2.5/forecast

openweather.api.reverse-geo-url=https://api.openweathermap.org/geo/1.0/reverse

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weathering_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use update to auto-create/update tables (use 'none' in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
